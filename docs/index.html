<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NutriPlan</title>
<meta name="description" content="Personalized meal plans designed around your nutritional needs">
<meta name="theme-color" content="#1A7A5A">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NutriPlan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
@font-face{font-family:Inter;font-style:normal;font-weight:400;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-style:normal;font-weight:500;font-display:swap;src:url(fonts/inter-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-style:normal;font-weight:600;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-style:normal;font-weight:700;font-display:swap;src:url(fonts/inter-latin-700-normal.woff2) format("woff2")}
:root{
  --tint:#1A7A5A;--tint-light:#2A9E74;--tint-dark:#0F5940;
  --accent:#E8963A;
  --bg:#FAF7F0;--bg2:#F0EBE0;--card:#FFFFFF;--outside:#EDE7DA;
  --text:#1C2128;--text2:#4A5568;--muted:#A0ADB8;
  --border:#E2E8F0;--border-light:#EDF2F7;
  --success:#27AE60;--danger:#E05252;
  --shadow:0 1px 4px rgba(28,33,40,.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --tint:#2FA57B;--tint-light:#3DBB8D;--tint-dark:#1A7A5A;--accent:#F0A552;
    --bg:#14181D;--bg2:#1C2128;--card:#1F252D;--outside:#0E1115;
    --text:#EEF1F4;--text2:#B4BEC9;--muted:#76838F;
    --border:#2D3540;--border-light:#262D36;--shadow:0 1px 4px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --tint:#2FA57B;--tint-light:#3DBB8D;--tint-dark:#1A7A5A;--accent:#F0A552;
  --bg:#14181D;--bg2:#1C2128;--card:#1F252D;--outside:#0E1115;
  --text:#EEF1F4;--text2:#B4BEC9;--muted:#76838F;
  --border:#2D3540;--border-light:#262D36;--shadow:0 1px 4px rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;background:var(--outside);color:var(--text);font:400 15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:8px}
img{max-width:100%;display:block}
.ic{flex:none;display:block}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative}
.app.with-tabs{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.app.full-tint{background:var(--tint)}
.screen{padding:20px 20px 32px}
.muted{color:var(--muted)}.small{font-size:13px}.center{text-align:center;margin-top:60px}
.title{font-size:26px;font-weight:700;margin:0;letter-spacing:-.01em}
.sub{margin:4px 0 20px;color:var(--text2)}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}

/* welcome */
.welcome{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:space-between;padding:56px 28px 40px;color:#fff;background:#1A7A5A}
.welcome-body{display:flex;flex-direction:column;align-items:center;text-align:center}
.logo-circle{width:88px;height:88px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;margin-bottom:24px}
.welcome-title{font-size:38px;font-weight:700;margin:0 0 10px;letter-spacing:-.02em}
.welcome-sub{font-size:16px;opacity:.82;max-width:30ch;margin:0 0 40px}
.feature-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:14px;align-self:stretch}
.feature-list li{display:flex;align-items:center;gap:14px;font-weight:500;text-align:left}
.feature-ic{width:34px;height:34px;border-radius:10px;background:#fff;color:#1A7A5A;display:grid;place-items:center;flex:none}
.btn-white{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1A7A5A;font-weight:600;font-size:17px;height:56px;border-radius:16px;margin-top:40px}

/* onboarding */
.onboard{padding-bottom:110px}
.ob-head{margin-bottom:18px}
.ob-head .icon-btn{margin:-6px 0 10px -6px}
.step-title{font-size:26px;font-weight:700;margin:0 0 8px;letter-spacing:-.01em}
.step-sub{color:var(--text2);margin:0 0 14px}
.counter{display:inline-block;color:var(--tint);font-weight:600;font-size:13px;background:color-mix(in srgb,var(--tint) 12%,transparent);padding:5px 12px;border-radius:999px}
.nutrient-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.n-card{position:relative;text-align:left;background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;transition:transform .12s,background .15s,border-color .15s}
.n-card:active{transform:scale(.96)}
.n-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--nc);background:color-mix(in srgb,var(--nc) 12%,transparent);margin-bottom:4px}
.n-name{font-weight:600}
.n-desc{font-size:12px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.n-card.on{background:var(--nc);border-color:var(--nc);color:#fff}
.n-card.on .n-ic{background:rgba(255,255,255,.2);color:#fff}
.n-card.on .n-desc{color:rgba(255,255,255,.75)}
.n-check{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.3);display:grid;place-items:center}
.link-danger{display:flex;align-items:center;gap:6px;margin:22px auto 0;color:var(--danger);font-size:13px;font-weight:500;padding:8px}
.bottom-cta{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;padding:14px 20px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:5}
.btn-primary{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:54px;border-radius:16px;background:var(--tint);color:#fff;font-weight:600;font-size:16px;transition:background .2s}
.btn-primary:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
.btn-primary.saved{background:var(--success)}
.btn-primary.narrow{width:auto;padding:0 28px;height:48px}

/* home */
.home-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.avatar{position:relative;width:44px;height:44px;border-radius:50%;background:var(--tint);color:#fff;display:grid;place-items:center}
.avatar-badge{position:absolute;right:-2px;bottom:-2px;width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);display:grid;place-items:center}
.summary{background:var(--tint);color:#fff;border-radius:20px;padding:20px;display:flex;gap:16px;margin-bottom:20px}
.summary>div:first-child{flex:1}
.sum-label{font-size:12px;font-weight:500;opacity:.72;margin-bottom:4px}
.sum-big{font-size:40px;font-weight:700;line-height:1.05;letter-spacing:-.02em}
.sum-desc{font-size:13px;opacity:.72}
.sum-right{display:flex;flex-direction:column;justify-content:center;gap:8px;min-width:0}
.mini{display:flex;align-items:center;gap:8px;font-size:13px;background:rgba(255,255,255,.14);padding:6px 10px;border-radius:10px}
.mini-name{flex:1;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.section{padding:18px;margin-bottom:24px}
.section-title{font-size:16px;font-weight:600;margin:0 0 14px}
.section-label{font-size:18px;font-weight:700;margin:0}
.prog+.prog{margin-top:14px}
.prog-label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;margin-bottom:6px}
.prog-label span:nth-child(2){flex:1}
.track{height:8px;background:var(--border-light);border-radius:99px;overflow:hidden}
.track.wide{margin:-6px 0 22px}
.fill{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.row-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.see-all{color:var(--tint);font-weight:600;font-size:14px}
.meal-row{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:10px;cursor:pointer;padding-right:14px}
.thumb{width:76px;height:76px;position:relative;flex:none;background:var(--bg2)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb-done{position:absolute;inset:0;background:rgba(26,122,90,.62);color:#fff;display:grid;place-items:center}
.row-body{flex:1;min-width:0}
.row-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-type{font-size:12px;font-weight:600;margin:1px 0 3px}
.row-meta{font-size:12px;color:var(--muted)}.row-meta span{margin-left:10px}
.check-btn{width:32px;height:32px;border-radius:50%;background:var(--border);color:var(--muted);display:grid;place-items:center;flex:none;transition:background .15s}
.check-btn.on{background:var(--tint);color:#fff}
.empty-day{padding:22px;text-align:center;color:var(--muted)}
.journal-card{display:flex;align-items:center;gap:12px;margin-top:20px;padding:16px;border-radius:16px;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);background:color-mix(in srgb,var(--accent) 9%,transparent);color:var(--accent)}
.journal-card.logged{border-color:color-mix(in srgb,var(--tint) 30%,transparent);background:color-mix(in srgb,var(--tint) 9%,transparent);color:var(--tint)}
.jc-body{flex:1}.jc-title{font-weight:600}.jc-sub{font-size:13px;color:var(--text2)}
.journal-card>.ic:last-child{color:var(--muted)}

/* plan */
.screen-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.head-actions{display:flex;gap:8px}
.head-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.head-btn.soft{background:color-mix(in srgb,var(--tint) 12%,transparent);color:var(--tint)}
.head-btn.solid{background:var(--tint);color:#fff}
.day-scroll{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 18px;padding:2px 20px 6px;scrollbar-width:none}
.day-scroll::-webkit-scrollbar{display:none}
.day-scroll.tight{margin-bottom:4px}
.day-chip{flex:none;min-width:56px;padding:10px 0 9px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:7px;font-weight:600;font-size:14px;border:1.5px solid transparent}
.day-chip.today{border-color:var(--tint);color:var(--tint)}
.day-chip.on{background:var(--tint);color:#fff;border-color:var(--tint)}
.day-chip.small{min-width:52px;padding:9px 0}
.day-prog{width:28px;height:3px;border-radius:2px;background:var(--border);overflow:hidden}
.day-prog span{display:block;height:100%;background:var(--tint)}
.day-chip.on .day-prog{background:rgba(255,255,255,.3)}.day-chip.on .day-prog span{background:#fff}
.meal-list{display:flex;flex-direction:column;gap:16px}
.meal-card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer}
.mc-img{position:relative;height:160px;background:var(--bg2)}
.mc-img img{width:100%;height:100%;object-fit:cover}
.mc-img::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.28),transparent 50%)}
.mc-done{position:absolute;inset:0;background:rgba(26,122,90,.55);color:#fff;display:grid;place-items:center;z-index:1}
.type-badge{position:absolute;left:12px;bottom:12px;z-index:2;color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px}
.mc-body{padding:14px 16px 14px}
.mc-top{display:flex;gap:12px;align-items:flex-start}
.mc-name{flex:1;font-size:17px;font-weight:600;margin:0;line-height:1.3}
.consume-btn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border);color:var(--muted);display:grid;place-items:center;flex:none}
.consume-btn.on{background:var(--tint);border-color:var(--tint);color:#fff}
.mc-benefit{color:var(--text2);font-size:13px;margin:6px 0 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mc-foot{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--muted)}
.mc-foot span{display:flex;align-items:center;gap:4px}.mc-foot .grow{flex:1}
.no-meals{display:flex;flex-direction:column;align-items:center;gap:10px;padding:48px 0;color:var(--muted)}
.no-meals p{margin:0}
.btn-outline{display:flex;align-items:center;gap:6px;border:1.5px solid var(--tint);color:var(--tint);padding:8px 16px;border-radius:12px;font-weight:600;font-size:14px}
.empty{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.empty-ic{width:88px;height:88px;border-radius:50%;background:color-mix(in srgb,var(--tint) 12%,transparent);color:var(--tint);display:grid;place-items:center;margin-bottom:20px}
.empty-title{font-size:21px;margin:0 0 8px}
.empty-desc{color:var(--text2);max-width:30ch;margin:0 0 24px}

/* grocery */
.ring{width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--tint) var(--p),var(--border) 0);display:grid;place-items:center}
.ring span{width:46px;height:46px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--tint)}
.category{margin-bottom:22px}
.cat-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cat-head h2{flex:1;font-size:15px;font-weight:600;margin:0}
.cat-head .muted{font-size:13px}
.cat-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.list-card{overflow:hidden}
.g-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 16px;transition:opacity .15s}
.g-item+.g-item,.ing+.ing{border-top:1px solid var(--border-light)}
.g-check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;flex:none;color:#fff}
.g-name{flex:1}
.g-item.done{opacity:.5}.g-item.done .g-name{text-decoration:line-through}
.g-item.done .g-check{background:var(--tint);border-color:var(--tint)}

/* journal */
.form-card{padding:18px;margin-bottom:28px}
.form-title{font-size:17px;font-weight:600;margin:0 0 4px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin:18px 0 8px}
.mood-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood-btn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);color:var(--mc);font-size:11px;font-weight:500}
.mood-btn span{color:var(--muted)}
.mood-btn.on{background:var(--mc);border-color:var(--mc);color:#fff}.mood-btn.on span{color:#fff}
.energy-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.energy-btn{padding:10px 0;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);color:var(--muted);font-size:13px;font-weight:600}
.energy-btn.on{background:var(--tint);border-color:var(--tint);color:#fff}
.input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);resize:vertical}
.input:focus{outline:none;border-color:var(--tint)}
.form-card .btn-primary{margin-top:16px;height:50px}
.entry{padding:14px 16px;margin:12px 0}
.entry-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.badges{display:flex;gap:6px}
.badge{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px}
.badge.tint{color:var(--tint);background:color-mix(in srgb,var(--tint) 12%,transparent)}
.entry-notes{margin:10px 0 0;font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.history-empty{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);padding:24px 0}
.history-empty p{margin:0;font-size:14px}

/* detail */
.detail{padding-bottom:110px}
.hero{position:relative;height:280px;background:var(--bg2)}
.hero img{width:100%;height:100%;object-fit:cover}
.hero-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.65),rgba(0,0,0,0) 60%)}
.hero-back{position:absolute;top:14px;left:14px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;display:grid;place-items:center;backdrop-filter:blur(6px)}
.hero-done{position:absolute;top:18px;right:14px;display:flex;gap:5px;align-items:center;color:#fff;background:var(--tint);font-size:12px;font-weight:600;padding:6px 11px;border-radius:99px}
.hero-text{position:absolute;left:20px;right:20px;bottom:20px;color:#fff}
.hero-text h1{font-size:26px;margin:8px 0 0;line-height:1.2;letter-spacing:-.01em}
.type-chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px}
.detail-body{padding:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.stat{padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:3px}
.stat b{font-size:16px}.stat span{font-size:12px;color:var(--muted)}
.benefit{display:flex;gap:12px;padding:16px;border-radius:14px;border:1px solid color-mix(in srgb,var(--tint) 28%,transparent);background:color-mix(in srgb,var(--tint) 7%,transparent);color:var(--tint);margin-bottom:24px}
.benefit p{margin:0;color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.n-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;font-size:13px;font-weight:600;color:var(--nc);background:color-mix(in srgb,var(--nc) 11%,transparent);border:1px solid color-mix(in srgb,var(--nc) 28%,transparent)}
.n-chip small{font-weight:500;opacity:.75}
.n-chip.pick{background:var(--card);border-color:var(--border);color:var(--text)}
.n-chip.pick .ic{color:var(--nc)}
.n-chip.pick.on{background:var(--nc);border-color:var(--nc);color:#fff}.n-chip.pick.on .ic{color:#fff}
.ing{display:flex;align-items:center;gap:12px;padding:13px 16px}

/* add */
.add{padding-bottom:40px}
.add-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.add-title{flex:1;font-size:19px;margin:0}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--text)}
.icon-btn.sm{width:28px;height:28px;color:var(--muted)}
.save-pill{background:var(--tint);color:#fff;font-weight:600;padding:8px 18px;border-radius:12px}
.type-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.type-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 0;border-radius:12px;border:1.5px solid var(--border);background:var(--card);font-weight:600;font-size:14px}
.type-btn .ic{color:var(--tc)}
.type-btn.on{background:var(--tc);border-color:var(--tc);color:#fff}.type-btn.on .ic{color:#fff}
.ing-card{padding:6px 12px 12px}
.ing-input{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border-light)}
.bare{flex:1;border:0;background:none;padding:12px 0;min-width:0}
.bare:focus{outline:none}
.add-ing{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:12px;padding:10px;border:1.5px dashed var(--border);border-radius:12px;color:var(--tint);font-weight:600;font-size:14px}
.meta-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.add .chips{margin-bottom:0}

/* tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--border);padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--muted);padding:4px 0}
.tab.on{color:var(--tint)}
#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:520px){.app{box-shadow:0 0 0 1px var(--border)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const CAT_COLORS = { Proteins: "#E74C3C", Produce: "#27AE60", Dairy: "#3498DB", Grains: "#F39C12", "Nuts & Seeds": "#8E44AD", Pantry: "#16A085", Other: "#95A5A6", Custom: "#E8963A" };
const MOODS = [
  { value: 1, icon: "frown", label: "Rough", color: "#E74C3C" },
  { value: 2, icon: "meh", label: "Tired", color: "#F39C12" },
  { value: 3, icon: "smile", label: "Okay", color: "#D4A90F" },
  { value: 4, icon: "smile", label: "Good", color: "#2ECC71" },
  { value: 5, icon: "heart", label: "Great", color: "#27AE60" },
];
const ENERGY_LABELS = ["Low", "Moderate", "High", "Peak"];

// ---------- helpers ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const icon = (n, size = 18, extra = "") =>
  `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${ICONS[n] || ""}</svg>`;
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const localDate = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const todayName = () => new Date().toLocaleString("en-US", { weekday: "long" });
const nutrient = (id) => NUTRIENTS.find((n) => n.id === id);

function mealImage(name, type) {
  const n = name.toLowerCase(), has = (...w) => w.some((x) => n.includes(x));
  if (has("smoothie", "açaí", "acai")) return FOOD_IMAGES.smoothie;
  if (has("oat", "pancake", "granola", "yogurt", "egg", "omelette", "toast", "pudding") || type === "breakfast") return FOOD_IMAGES.breakfast;
  if (has("salmon", "tuna", "sardine", "sushi", "fish")) return FOOD_IMAGES.salmon;
  if (has("soup", "stew", "chowder")) return FOOD_IMAGES.soup;
  if (has("salad", "caesar", "niçoise", "nicoise")) return FOOD_IMAGES.salad;
  if (has("stir fry", "stir-fry", "tofu", "asian", "bok choy")) return FOOD_IMAGES.stirfry;
  if (has("bowl", "wrap", "hummus", "taco", "platter") || type === "lunch") return FOOD_IMAGES.lunchBowl;
  return FOOD_IMAGES.dinner;
}

function getWeekStart() {
  const now = new Date(), day = now.getDay();
  const monday = new Date(now);
  monday.setDate(now.getDate() - day + (day === 0 ? -6 : 1));
  return localDate(monday);
}

// ---------- state & persistence ----------
const defaultState = () => ({ selectedNutrients: [], weeklyMeals: [], groceryItems: [], journalEntries: [], weekStartDate: getWeekStart() });
let state = defaultState();

function persist(next) {
  state = next;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  render();
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = { ...defaultState(), ...JSON.parse(raw) };
  } catch (e) {}
}

const actions = {
  toggleNutrient(id) {
    const sel = state.selectedNutrients;
    if (sel.includes(id)) persist({ ...state, selectedNutrients: sel.filter((n) => n !== id) });
    else if (sel.length < 4) persist({ ...state, selectedNutrients: [...sel, id] });
    else toast("You can pick up to 4 nutrients");
  },
  generatePlan() {
    const meals = generateWeeklyMeals(state.selectedNutrients);
    persist({ ...state, weeklyMeals: meals, groceryItems: generateGroceryList(meals), weekStartDate: getWeekStart() });
  },
  toggleMeal(id) {
    persist({ ...state, weeklyMeals: state.weeklyMeals.map((m) => (m.id === id ? { ...m, consumed: !m.consumed } : m)) });
  },
  toggleGrocery(id) {
    persist({ ...state, groceryItems: state.groceryItems.map((g) => (g.id === id ? { ...g, checked: !g.checked } : g)) });
  },
  saveJournal({ mood, energy, notes }) {
    const today = localDate();
    const existing = state.journalEntries.find((e) => e.date === today);
    if (existing) {
      persist({ ...state, journalEntries: state.journalEntries.map((e) => (e.id === existing.id ? { ...e, mood, energy, notes } : e)) });
    } else {
      const entry = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), date: today, mood, energy, notes, consumedMealIds: state.weeklyMeals.filter((m) => m.consumed).map((m) => m.id) };
      persist({ ...state, journalEntries: [...state.journalEntries, entry] });
    }
  },
  addCustomMeal(input) {
    const id = `custom_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    const meal = { id, ...input, consumed: false };
    const items = input.ingredients.map((ing, i) => ({ id: `${id}_ing_${i}`, name: cap(ing), category: "Custom", amount: "", checked: false }));
    persist({ ...state, weeklyMeals: [...state.weeklyMeals, meal], groceryItems: [...state.groceryItems, ...items] });
  },
  resetAll() {
    persist(defaultState());
    go("onboarding");
  },
};

const mealsByDay = (day) => state.weeklyMeals.filter((m) => m.day === day);
function nutrientProgress(nid) {
  const meals = state.weeklyMeals.filter((m) => m.day === todayName() && m.nutrients.includes(nid));
  return meals.length ? meals.filter((m) => m.consumed).length / meals.length : 0;
}

// ---------- routing ----------
let route = { name: "home", param: null };
let onboardStep = 0;
let planDay = todayName();
let addForm = null;
let journalDraft = null;
const TABS = ["home", "plan", "grocery", "journal"];

function parseHash() {
  const [name, param] = location.hash.replace(/^#\/?/, "").split("/");
  return { name: name || "home", param: param ? decodeURIComponent(param) : null };
}
function go(name, param) {
  const h = "#/" + name + (param ? "/" + encodeURIComponent(param) : "");
  if (location.hash === h) render();
  else location.hash = h;
}
function back() {
  if (window.__navCount > 0) history.back();
  else go("home");
}
window.__navCount = 0;
window.addEventListener("hashchange", () => {
  window.__navCount++;
  route = parseHash();
  if (route.name === "add") addForm = null;
  if (route.name === "journal") journalDraft = null;
  render(true);
});

// ---------- toast ----------
let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

// ---------- views ----------
function viewOnboarding() {
  const editing = state.weeklyMeals.length > 0;
  if (onboardStep === 0 && !editing) {
    const feats = [["target", "Target specific vitamins & minerals"], ["calendar", "Weekly meal plans tailored for you"], ["shopping-cart", "Auto-generated grocery lists"], ["book", "Wellness journal & intake tracker"]];
    return `<section class="welcome">
      <div class="welcome-body">
        <div class="logo-circle">${icon("trending-up", 40)}</div>
        <h1 class="welcome-title">NutriPlan</h1>
        <p class="welcome-sub">Personalized meal plans designed around your nutritional needs</p>
        <ul class="feature-list">${feats.map(([i, t]) => `<li><span class="feature-ic">${icon(i, 16)}</span>${t}</li>`).join("")}</ul>
      </div>
      <button class="btn-white" data-act="start">Get started ${icon("arrow-right", 20)}</button>
    </section>`;
  }

    <header class="ob-head">

    <div class="nutrient-grid">
      ${NUTRIENTS.map((n) => {
        const on = sel.includes(n.id);
        return `<button class="n-card ${on ? "on" : ""}" style="--nc:${n.color}" data-act="nutrient" data-id="${n.id}" aria-pressed="${on}">
          <span class="n-ic">${icon(n.icon, 20)}</span>
          <span class="n-name">${n.name}</span>
          <span class="n-desc">${n.description}</span>
          ${on ? `<span class="n-check">${icon("check", 12)}</span>` : ""}
        </button>`;
      }).join("")}
    </div>
    ${editing ? `<button class="link-danger" data-act="reset">${icon("rotate-ccw", 14)} Reset everything</button>` : ""}
    <div class="bottom-cta">
      <button class="btn-primary" data-act="generate" ${sel.length ? "" : "disabled"}>${icon("zap", 20)} ${editing ? "Rebuild my plan" : "Generate my plan"}</button>

  const c = TYPE_CFG[m.type] || TYPE_CFG.dinner;

    <div class="row-body">
      <div class="row-name">${esc(m.name)}</div>
      <div class="row-type" style="color:${c.color}">${c.label}</div>
      <div class="row-meta">${m.calories} kcal <span>${esc(m.prepTime)}</span></div>
    </div>

  </div>`;
}

function emptyScreen(ic, title, desc, btn) {

}

function viewPlan() {

  const today = todayName();
  const meals = [...mealsByDay(planDay)].sort((a, b) => TYPE_ORDER.indexOf(a.type) - TYPE_ORDER.indexOf(b.type));
  return `<section class="screen">
    <header class="screen-head">
      <h1 class="title">Weekly plan</h1>
      <div class="head-actions">
        <button class="head-btn soft" data-act="regen" aria-label="Rebuild plan" title="Rebuild plan">${icon("refresh-cw", 16)}</button>
        <a class="head-btn solid" href="#/add" aria-label="Add a meal" title="Add a meal">${icon("plus", 16)}</a>
      </div>
    </header>
    <div class="day-scroll" role="tablist">
      ${DAYS_OF_WEEK.map((d) => {
        const dm = mealsByDay(d), c = dm.filter((m) => m.consumed).length;
        return `<button role="tab" aria-selected="${d === planDay}" class="day-chip ${d === planDay ? "on" : ""} ${d === today ? "today" : ""}" data-act="day" data-day="${d}">
          <span>${d.slice(0, 3)}</span>

      ${meals.length ? meals.map((m) => {
        const c = TYPE_CFG[m.type] || TYPE_CFG.dinner;
        return `<article class="meal-card" data-act="open-meal" data-id="${esc(m.id)}" role="link" tabindex="0">
          <div class="mc-img"><img src="${mealImage(m.name, m.type)}" alt="" loading="lazy">

          <div class="mc-body">
            <div class="mc-top"><h3 class="mc-name">${esc(m.name)}</h3>
              <button class="consume-btn ${m.consumed ? "on" : ""}" data-act="toggle-meal" data-id="${esc(m.id)}" aria-label="${m.consumed ? "Unmark" : "Mark"} as eaten">${icon(m.consumed ? "check" : "circle", 14)}</button>

            <p class="mc-benefit">${esc(m.benefits)}</p>

function viewGrocery() {
  if (!state.groceryItems.length) return emptyScreen("shopping-cart", "Your list is empty", "Generate a meal plan and your grocery list will appear here automatically");
  const by = {};
  for (const it of state.groceryItems) (by[it.category] ||= []).push(it);
  const total = state.groceryItems.length, checked = state.groceryItems.filter((i) => i.checked).length;
  const p = total ? checked / total : 0;
  return `<section class="screen">
    <header class="screen-head">
      <div><h1 class="title">Grocery list</h1><div class="muted small">${checked}/${total} items checked</div></div>
      <div class="ring" style="--p:${p * 360}deg"><span>${Math.round(p * 100)}%</span></div>
    </header>
    <div class="track wide"><div class="fill" style="background:var(--tint);width:${p * 100}%"></div></div>
    ${Object.keys(by).sort().map((cat) => {
      const items = by[cat], col = CAT_COLORS[cat] || "#95A5A6";
      return `<div class="category">
        <div class="cat-head"><span class="cat-ic" style="color:${col};background:${col}1f">${icon(CAT_ICONS[cat] || "list", 14)}</span><h2>${esc(cat)}</h2><span class="muted">${items.filter((i) => i.checked).length}/${items.length}</span></div>
        <div class="card list-card">
          ${items.map((it) => `<button class="g-item ${it.checked ? "done" : ""}" data-act="toggle-grocery" data-id="${esc(it.id)}" aria-pressed="${it.checked}">
            <span class="g-check">${it.checked ? icon("check", 14) : ""}</span><span class="g-name">${esc(it.name)}</span>${it.amount ? `<span class="muted">${esc(it.amount)}</span>` : ""}
          </button>`).join("")}
        </div>
      </div>`;
    }).join("")}
  </section>`;
}

    <input id="f-name" class="input" data-field="name" value="${esc(f.name)}" placeholder="e.g. Avocado chicken bowl">
    <div class="form-label">Meal type</div>
    <div class="type-row">${Object.entries(TYPE_CFG).map(([k, t]) => `<button class="type-btn ${f.type === k ? "on" : ""}" style="--tc:${t.color}" data-act="f-type" data-v="${k}">${icon(t.icon, 16)} ${t.label}</button>`).join("")}</div>
    <div class="form-label">Day of the week</div>
    <div class="day-scroll tight">${DAYS_OF_WEEK.map((d) => `<button class="day-chip small ${f.day === d ? "on" : ""}" data-act="f-day" data-v="${d}">${d.slice(0, 3)}</button>`).join("")}</div>
    <div class="form-label">Ingredients *</div>
    <div class="card ing-card">
      ${f.ingredients.map((v, i) => `<div class="ing-input"><span class="dot" style="background:var(--tint)"></span><input class="bare" data-ing="${i}" value="${esc(v)}" placeholder="Ingredient ${i + 1}" aria-label="Ingredient ${i + 1}">${f.ingredients.length > 1 ? `<button class="icon-btn sm" data-act="rm-ing" data-i="${i}" aria-label="Remove ingredient">${icon("x", 16)}</button>` : ""}</div>`).join("")}
      <button class="add-ing" data-act="add-ing">${icon("plus", 14)} Add ingredient</button>
    </div>
    <label class="form-label" for="f-ben">Health benefits</label>
    <textarea id="f-ben" class="input" rows="3" data-field="benefits" placeholder="Describe the nutritional benefits of this meal">${esc(f.benefits)}</textarea>
    <div class="form-label">Nutrients (optional)</div>
    <div class="chips">${NUTRIENTS.map((n) => `<button class="n-chip pick ${f.nutrients.includes(n.id) ? "on" : ""}" style="--nc:${n.color}" data-act="f-nut" data-v="${n.id}">${icon(n.icon, 12)} ${n.name}</button>`).join("")}</div>
    <div class="meta-row">
      <div><label class="form-label" for="f-cal">Calories</label><input id="f-cal" class="input" inputmode="numeric" data-field="calories" value="${esc(f.calories)}" placeholder="400"></div>
      <div><label class="form-label" for="f-prep">Prep time</label><input id="f-prep" class="input" data-field="prepTime" value="${esc(f.prepTime)}" placeholder="20 min"></div>
    </div>
    <button class="btn-primary" data-act="save-meal">${icon("check", 20)} Add to my plan</button>
  </section>`;
}

function tabBar() {
  const items = [["home", "home", "Home"], ["plan", "calendar", "Plan"], ["grocery", "shopping-cart", "Grocery"], ["journal", "book", "Journal"]];
  return `<nav class="tabbar">${items.map(([r, i, l]) => `<a href="#/${r}" class="tab ${route.name === r ? "on" : ""}" ${route.name === r ? 'aria-current="page"' : ""}>${icon(i, 22)}<span>${l}</span></a>`).join("")}</nav>`;
}

// ---------- render ----------
function render(scrollTop) {
  if (!state.weeklyMeals.length && TABS.includes(route.name) && route.name === "home") route = { name: "onboarding" };
  let html;
  switch (route.name) {
    case "onboarding": html = viewOnboarding(); break;
    case "plan": html = viewPlan(); break;
    case "grocery": html = viewGrocery(); break;
    case "journal": html = viewJournal(); break;
    case "meal": html = viewMeal(route.param); break;
    case "add": html = viewAdd(); break;
    default: html = viewHome();
  }
  const showTabs = TABS.includes(route.name);
  const app = $("#app");
  const y = window.scrollY;
  const daysX = document.querySelector(".day-scroll")?.scrollLeft;
  app.className = "app " + (showTabs ? "with-tabs" : "") + (route.name === "onboarding" && onboardStep === 0 && !state.weeklyMeals.length ? " full-tint" : "");
  app.innerHTML = html + (showTabs ? tabBar() : "");
  if (scrollTop) window.scrollTo(0, 0);
  else {
    window.scrollTo(0, y);
    const ds = document.querySelector(".day-scroll");
    if (ds && daysX != null) ds.scrollLeft = daysX;
  }
  if (scrollTop && route.name === "plan") document.querySelector(".day-chip.on")?.scrollIntoView({ inline: "center", block: "nearest" });
}

// ---------- events ----------
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  switch (a) {
    case "start": onboardStep = 1; render(true); break;
    case "nutrient": actions.toggleNutrient(id); break;
    case "generate":
      if (!state.selectedNutrients.length) return;
      actions.generatePlan(); planDay = todayName(); go("home"); toast("Your weekly plan is ready"); break;
    case "edit-goals": onboardStep = 1; go("onboarding"); break;
    case "reset":
      if (confirm("Delete your plan, grocery list and journal? This can't be undone.")) { onboardStep = 0; actions.resetAll(); }
      break;
    case "back": back(); break;
    case "open-meal": go("meal", id); break;
    case "toggle-meal": e.stopPropagation(); actions.toggleMeal(id); break;
    case "toggle-grocery": actions.toggleGrocery(id); break;
    case "day": planDay = el.dataset.day; render(); break;
    case "regen":
      if (confirm("Rebuild this week's plan? Meals you've marked as eaten and custom meals will be cleared.")) { actions.generatePlan(); toast("Plan rebuilt"); }
      break;
    case "mood": journalDraft.mood = +v; journalDraft.saved = false; render(); break;
    case "energy": journalDraft.energy = +v; journalDraft.saved = false; render(); break;
    case "save-journal":
      journalDraft.notes = $("#notes").value;
      actions.saveJournal(journalDraft); journalDraft.saved = true; render(); break;
    case "f-type": addForm.type = v; render(); break;
    case "f-day": addForm.day = v; render(); break;
    case "f-nut": addForm.nutrients = addForm.nutrients.includes(v) ? addForm.nutrients.filter((x) => x !== v) : [...addForm.nutrients, v]; render(); break;
    case "add-ing":
      if (addForm.ingredients.length < 20) { addForm.ingredients.push(""); render(); document.querySelector(`[data-ing="${addForm.ingredients.length - 1}"]`)?.focus(); }
      break;
    case "rm-ing": addForm.ingredients.splice(+el.dataset.i, 1); render(); break;
    case "save-meal": {
      const f = addForm;
      if (!f.name.trim()) { toast("Enter a meal name"); $("#f-name").focus(); return; }
      const ings = f.ingredients.map((s) => s.trim()).filter(Boolean);
      if (!ings.length) { toast("Add at least one ingredient"); return; }
      actions.addCustomMeal({ name: f.name.trim(), type: f.type, day: f.day, ingredients: ings, benefits: f.benefits.trim() || "Custom meal added by you", calories: parseInt(f.calories) || 400, prepTime: f.prepTime.trim() || "20 min", nutrients: f.nutrients });
      planDay = f.day; addForm = null; toast("Meal added to " + f.day); go("plan");
      break;
    }
  }
});
document.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="link"]')) { e.preventDefault(); go("meal", e.target.dataset.id); }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.field && addForm) addForm[t.dataset.field] = t.value;
  if (t.dataset.ing != null && addForm) addForm.ingredients[+t.dataset.ing] = t.value;
  if (t.id === "notes" && journalDraft) {
    journalDraft.notes = t.value;
    if (journalDraft.saved) { journalDraft.saved = false; const b = document.querySelector('[data-act="save-journal"]'); if (b) { b.classList.remove("saved"); b.innerHTML = icon("save", 18) + " Save entry"; } }
  }
});

// ---------- boot ----------
loadLocal();
route = parseHash();
if (!state.weeklyMeals.length && route.name !== "onboarding") route = { name: "onboarding" };
render(true);
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
</script>
</body>
</html>
