# Render Blueprint for the NutriPlan API (the sync backend). Database: a free Neon Postgres.
services:
  - type: web
    name: nutriplan-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @workspace/db run push &&
      pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false # paste the Neon connection string when Render asks
